  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@^1.4.0
  vitest: 5.0.5
  vite-plus: ^1.4.0
  "@oxlint/plugins": 1.89.0
  grammy: ^1.46.0
  typebox: 1.3.27
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  "@tanstack/react-start": ^1.169.0
  "@tanstack/react-router": ^1.170.0
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-db": ^1.0.0-rc.1
  "@tanstack/query-db-collection": ^1.5.0
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.0
  "@base-ui/react": ^1.9.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
