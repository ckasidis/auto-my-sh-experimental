  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  lucide-react: ~1.64.0
  croner: ^11.0.0
  cronstrue: ^3.38.0
  cf: 1.0.0-beta.26
  "@cloudflare/vite-plugin": 2.0.0-beta.v.9
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - agents@0.31.0
  - "@cloudflare/build-output-utils@0.9.7"
  - "@cloudflare/config@0.29.1"
  - "@cloudflare/runtime-types@0.1.20"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.9"
  - miniflare@5.20261101.0-beta
allowBuilds:
  "@google/genai": false
  core-js-pure: false
  esbuild: true
  protobufjs: false
  workerd: true
